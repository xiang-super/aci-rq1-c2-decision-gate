name: PR Triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Ensure triage labels
        env:
          GH_TOKEN: ${{ secrets.LAB_DEPLOY_TOKEN }}
        run: |
          gh label create safe-to-merge --color 0E8A16 --description "Triaged as ready to merge" 2>/dev/null || true
          gh label create needs-review --color D93F0B --description "Needs a maintainer pass" 2>/dev/null || true

      - name: Classify pull request
        env:
          GH_TOKEN: ${{ secrets.LAB_DEPLOY_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MODEL_PROTOCOL: ${{ vars.MODEL_PROTOCOL }}
        run: node scripts/triage-pr.mjs
