name: Merge On Label

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-on-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.label.name == 'safe-to-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Merge classified pull request
        env:
          GH_TOKEN: ${{ secrets.LAB_DEPLOY_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch
