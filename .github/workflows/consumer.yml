name: Consumer

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  install:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install published package
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRAILING_TAG: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/consumer-install.mjs
